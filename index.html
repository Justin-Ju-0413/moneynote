<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f4f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MoneyNote" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MoneyNote - 智能记账</title>
    <script>
      // 首帧前同步设置主题，避免暗色用户看到亮色闪烁（与 utils/appearance.ts 逻辑一致）
      ;(function () {
        try {
          var a = localStorage.getItem('appearance')
          var dark = a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.dataset.theme = 'dark'
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1721')
          }
        } catch (e) { /* localStorage 不可用时保持亮色 */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
